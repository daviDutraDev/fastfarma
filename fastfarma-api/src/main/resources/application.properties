# =============================================
# FastFarma API — Configuração padrão
# =============================================
# Por padrão, a aplicação sobe com H2 in-memory, então basta rodar
# `mvn spring-boot:run` (ou executar pela IDE) que a API funciona
# sem nenhuma configuração adicional.
#
# Para usar PostgreSQL (produção), use o perfil "prod":
#   java -jar target/sistema-pedidos-1.0.jar --spring.profiles.active=prod
# ou defina no launch da IDE a propriedade:
#   -Dspring.profiles.active=prod
# Nesse caso, o banco precisa existir e o schema precisa ter sido
# carregado via sql/01-schema.sql.
# =============================================

server.port=8080

# Banco padrão: H2 em memória (PostgreSQL-compatible mode)
spring.datasource.url=jdbc:h2:mem:fastfarma;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nomenclatura
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# =============================================
# JWT (FastFarma)
# =============================================
# Segredo de assinatura — em produção, defina via variavel de ambiente
# FASTFARMA_JWT_SECRET (>= 256 bits / 32 chars). O default abaixo é apenas
# para dev local e JAMAIS deve ser usado em prod.
fastfarma.jwt.secret=${FASTFARMA_JWT_SECRET:dev-secret-troque-em-producao-32-chars-min}
fastfarma.jwt.expiration-minutes=1440

# WhatsApp / Evolution API
fastfarma.whatsapp.provider=evolution
fastfarma.whatsapp.evolution.base-url=${EVOLUTION_API_URL:http://localhost:8081}
fastfarma.whatsapp.evolution.api-key=${EVOLUTION_API_KEY:}
fastfarma.whatsapp.evolution.instance=${EVOLUTION_INSTANCE:fastfarma}
fastfarma.whatsapp.enabled=${FASTFARMA_WHATSAPP_ENABLED:false}



# E-mail (SMTP / Gmail)
# A senha NAO fica aqui: defina EMAIL_PASSWORD (senha de app do Google)
# e EMAIL_USERNAME como variaveis de ambiente. Desligado por padrao.
fastfarma.email.enabled=${FASTFARMA_EMAIL_ENABLED:true}
fastfarma.email.host=${EMAIL_HOST:smtp.gmail.com}
fastfarma.email.port=${EMAIL_PORT:587}
fastfarma.email.username=${EMAIL_USERNAME:fastfarmasistema@gmail.com}
fastfarma.email.password=${EMAIL_PASSWORD:mpnvxvbsbvvukzjb}
fastfarma.email.from-name=FastFarma