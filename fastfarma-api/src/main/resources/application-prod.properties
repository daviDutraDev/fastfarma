# =============================================
# FastFarma API — Perfil de produção (PostgreSQL)
# =============================================
# Ativar com: --spring.profiles.active=prod
#
# Requisitos:
#   1) PostgreSQL rodando em localhost:5432
#   2) Banco "fastfarma_db" criado
#   3) Schema carregado a partir de sql/01-schema.sql
#   4) Usuário "postgres" com senha correspondente abaixo
# Ajuste usuário/senha conforme a sua instalação.
# =============================================

# Banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fastfarma_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (valida o schema, não cria/atualiza)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nomenclatura
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
