# =============================================
# FastFarma API - Perfil DEV (H2 in-memory)
# =============================================
# Use com:  java -jar ... --spring.profiles.active=dev
# Substitui o PostgreSQL por um banco H2 em memoria,
# util para rodar a API sem precisar instalar Postgres.
# =============================================

server.port=8080

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:fastfarma;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
